<!doctype html>
<!-- Quelle für das App-Icon von Spell Legends: Trankfläschchen mit Korken und goldenem Inhalt, Tintenkontur,
     auf Zaubertrank-Violett mit Heftlinien (erlebnis.md 2). Rendern: siehe README („Icons neu erzeugen“).
     ?s=0.6 für die maskable-Variante (Inhalt kleiner, damit Android ihn rund beschneiden darf). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(120% 85% at 50% 0%, #B04AB5 0%, #8E2A93 52%, #6C1F71 100%);
  }
  /* Heftlinien, nach unten ausgeblendet */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 86px, rgba(255, 255, 255, .13) 86px 94px);
    -webkit-mask-image: linear-gradient(#000 0%, rgba(0, 0, 0, .45) 50%, transparent 85%);
  }
  svg { position: absolute; left: 50%; top: 50%; width: 1024px; height: 1024px; margin: -512px 0 0 -512px;
        transform: scale(var(--s, .9)); z-index: 1; }
</style>
</head>
<body>
  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="bauch"><path d="M412 300 L612 300 L612 420 C742 470 800 560 800 660 C800 820 670 920 512 920 C354 920 224 820 224 660 C224 560 282 470 412 420 Z"/></clipPath>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FFD23F"/><stop offset="1" stop-color="#F2B520"/>
      </linearGradient>
    </defs>
    <!-- Schatten unter dem Fläschchen (Familien-Look: harter Tintenschatten) -->
    <path transform="translate(0 34)" d="M412 300 L612 300 L612 420 C742 470 800 560 800 660 C800 820 670 920 512 920 C354 920 224 820 224 660 C224 560 282 470 412 420 Z" fill="#2A0E33"/>
    <!-- Glas -->
    <path d="M412 300 L612 300 L612 420 C742 470 800 560 800 660 C800 820 670 920 512 920 C354 920 224 820 224 660 C224 560 282 470 412 420 Z" fill="#F6EAF8"/>
    <!-- Goldener Trank mit Welle -->
    <g clip-path="url(#bauch)">
      <path d="M150 560 C260 520 340 600 450 565 C560 530 630 600 740 560 C800 540 850 548 880 556 L880 960 L150 960 Z" fill="url(#gold)"/>
      <circle cx="430" cy="720" r="26" fill="#FFF3A6" opacity=".9"/>
      <circle cx="560" cy="790" r="18" fill="#FFF3A6" opacity=".9"/>
      <circle cx="610" cy="660" r="12" fill="#FFF3A6" opacity=".9"/>
      <!-- Glanz auf dem Glas -->
      <path d="M300 600 C300 540 340 495 395 470" stroke="#fff" stroke-width="34" stroke-linecap="round" fill="none" opacity=".75"/>
    </g>
    <!-- Tintenkontur -->
    <path d="M412 300 L612 300 L612 420 C742 470 800 560 800 660 C800 820 670 920 512 920 C354 920 224 820 224 660 C224 560 282 470 412 420 Z" fill="none" stroke="#2A0E33" stroke-width="30" stroke-linejoin="round"/>
    <!-- Korken -->
    <rect x="380" y="180" width="264" height="140" rx="30" fill="#2A0E33" transform="translate(0 22)"/>
    <rect x="380" y="180" width="264" height="140" rx="30" fill="#C98A4B" stroke="#2A0E33" stroke-width="30"/>
    <path d="M430 230 L594 230" stroke="#A86A33" stroke-width="18" stroke-linecap="round"/>
    <!-- Funkeln -->
    <path d="M800 230 L818 282 L870 300 L818 318 L800 370 L782 318 L730 300 L782 282 Z" fill="#FFD23F" stroke="#2A0E33" stroke-width="16" stroke-linejoin="round"/>
    <path d="M196 380 L206 410 L236 420 L206 430 L196 460 L186 430 L156 420 L186 410 Z" fill="#fff" stroke="#2A0E33" stroke-width="12" stroke-linejoin="round"/>
  </svg>
  <script>
    const s = new URLSearchParams(location.search).get('s');
    if (s) document.querySelector('svg').style.setProperty('--s', s);
  </script>
</body>
</html>
